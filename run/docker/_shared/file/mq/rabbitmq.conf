log.console.level=error

# Keepalive (alternative to heartbeats, when we deal with single-thread languages such as PHP)
# See "tcp_listen_options.keepalive" in https://www.rabbitmq.com/networking.html
tcp_listen_options.keepalive=true

# See https://stackoverflow.com/questions/53374144/rabbitmq-ack-timeout
consumer_timeout=7200000