[supervisord]
logfile = /var/log/supervisord.log
logfile_maxbytes = 40MB
logfile_backups=4
loglevel = info

[program:ssl]
command=/supervise-domains.sh
autostart = true
autorestart = true
redirect_stderr = true
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups = 2
stdout_logfile = /var/log/supervise-domains.log
