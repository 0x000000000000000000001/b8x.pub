user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    # 1024 * 1
    worker_connections 2048;
    # multi_accept on;
}

http {
    log_format debug '$host $remote_addr - $remote_user xxx[$time_local]xxx '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 9600s;
    client_header_timeout 9600s;
    client_body_timeout 9600s;
    send_timeout 9600s;
    types_hash_max_size 2048;
    server_tokens off;

    # Sitemap Cache
    proxy_cache_path /var/cache/nginx/sitemap_cache levels=1:2 keys_zone=sitemap_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # API Read Cache (for POST queries)
    proxy_cache_path /var/cache/nginx/api_read_cache levels=1:2 keys_zone=api_read_cache:10m max_size=500m inactive=10m use_temp_path=off;

    server_names_hash_bucket_size 1024;
    map_hash_max_size 8192;
    map_hash_bucket_size 256;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        # added
        image/svg+xml;

    # Maps are very useful (e.g. see https://stackoverflow.com/a/58200058)
    # Note that for headers usage, what's nice is that any add_header instruction with an empty value is ignored
    map $http_user_agent $is_social_bot {
        default 0;
        ~*(facebookexternalhit|twitterbot|pinterest|linkedinbot|whatsapp|telegrambot|slackbot|vkshare|w3c_validator|metatags|discordbot|skypeuripreview|applebot) 1;
    }
    map $http_user_agent $is_bot {
        default 0;
        ~*(googlebot|bingbot|yandex|baiduspider|bytespider|rogerbot|embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|vkshare|w3c_validator|metatags|discordbot|skypeuripreview|applebot) 1;
    }
    map $http_accept_language $browser_locale {
        default en;
        ~*^fr fr;
    }
    map $request_method $asset_header_access_control_allow_origin {
        GET *;
        POST *;
        OPTIONS *;
        default '';
    }
    map $request_method $asset_header_access_control_allow_credentials {
        GET true;
        POST true;
        OPTIONS true;
        default '';
    }
    map $request_method $asset_header_access_control_allow_methods {
        GET 'GET, OPTIONS';
        POST 'GET, OPTIONS';
        OPTIONS 'GET, OPTIONS';
        default '';
    }
    map $request_method $asset_header_access_control_allow_headers {
        GET *;
        POST *;
        OPTIONS *;
        default '';
    }
    map $request_method $asset_header_access_control_max_age {
        OPTIONS 1728000;
        default '';
    }
    map $request_method $asset_header_content_type {
        OPTIONS 'text/plain charset=UTF-8';
        default '';
    }
    map $request_method $asset_header_content_length {
        OPTIONS 0;
        default '';
    }

    ##
    # Virtual Host Configs
    ##

    # For healthchecks (e.g. Docker)
    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        return 200;
    }

    include /etc/nginx/conf.d/redir/map/*.conf;
    include /etc/nginx/conf.d/b8x.conf;

    # For files in general
    client_max_body_size 10G;
    client_body_temp_path /tmp 1 2;
    client_body_buffer_size 10m;
    client_body_in_file_only off;

    # See https://dzone.com/articles/nginx-rate-limiting
    limit_req_zone $binary_remote_addr zone=perip:50m rate=10000r/s;
}
