services:
  cron:
    volumes:
      - ${DOCKER_CONTEXT_SOCK}:/var/run/docker.sock
      - ${ROOT_DIR}:/var/www/b8x
    env_file:
      - ${ROOT_DIR}/env/_shared/api.env
      - ${ROOT_DIR}/env/${ENV}/api.env
      - ${ROOT_DIR}/env/_shared/db.env
      - ${ROOT_DIR}/env/${ENV}/db.env
      - ${ROOT_DIR}/env/_shared/db2.env
      - ${ROOT_DIR}/env/${ENV}/db2.env
      - ${ROOT_DIR}/env/_shared/s3.env
      - ${ROOT_DIR}/env/${ENV}/s3.env
    entrypoint: ['sh', '/docker-entrypoint.sh']
    # Option "cron -L15" reflects highest debugging level
    command: >
      bash -c "
        /wait db-multiplex-store:5432 -t ${WAIT_DELAY} -- 
        /wait db-multiplex-store-lock:5432 -t ${WAIT_DELAY} -- 
        /wait db-multiplex-edge:5432 -t ${WAIT_DELAY} --
        /wait db2:3306 -t ${WAIT_DELAY} --
        /wait mq:5672 -t ${WAIT_DELAY} --
        cron -f -L15 && tail -f /var/log/cron.log"
    stdin_open: true
    tty: true
    working_dir: /var/www/b8x
