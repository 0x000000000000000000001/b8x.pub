services:
  webserver:
    image: "${DOCKER_IMAGE_PREFIX}/${DOCKER_IMAGE_WEBSERVER}"
    volumes:
      - ${ROOT_DIR}/:/var/www/b8x
    stdin_open: true
    working_dir: /var/www/b8x
    tty: true
    environment:
      ENV: ${ENV}
      TZ: ${TZ}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
      API_DNS_LEVEL_3_GTE: "${API_DNS_LEVEL_3_GTE}"
      MQ_DNS_LEVEL_3_GTE: "${MQ_DNS_LEVEL_3_GTE}"
      NEWS_DNS_LEVEL_3_GTE: "${NEWS_DNS_LEVEL_3_GTE}"
      DNS_LEVEL_1: ${DNS_LEVEL_1}
      DNS_LEVEL_2_a: ${DNS_LEVEL_2_a}
      DNS_LEVEL_2_GTE: "${DNS_LEVEL_2_GTE}"
      DNS_DEFAULT_PORT: ${DNS_DEFAULT_PORT}
      DNS_DEFAULT_SCHEME: ${DNS_DEFAULT_SCHEME}
      DNS_LEVEL_2: ${DNS_LEVEL_2}
      DNS_LEVEL_2_b: ${DNS_LEVEL_2_b}
      NGINX_DEFAULT_HTTP_PORT: ${NGINX_DEFAULT_HTTP_PORT}
      HEALTHCHECK_INTERVAL: ${WEBSERVER_DOCKER_HEALTHCHECK_INTERVAL}
      HEALTHCHECK_TIMEOUT: ${WEBSERVER_DOCKER_HEALTHCHECK_TIMEOUT}
      HEALTHCHECK_RETRIES: ${WEBSERVER_DOCKER_HEALTHCHECK_RETRIES}
