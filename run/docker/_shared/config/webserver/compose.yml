services:
  webserver:
    cap_add:
      - NET_ADMIN
    restart: always
    labels:
      x.traefik.gateway: 'gateway'

      traefik.enable: 'true'

      traefik.http.services.webserver.loadbalancer.server.port: '80'

      traefik.http.services.swebserver.loadbalancer.server.scheme: 'https'
      traefik.http.services.swebserver.loadbalancer.server.port: '443'
    networks:
      - compose-default
