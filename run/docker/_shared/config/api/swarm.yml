services:
  api:
    # Without the healthcheck, the command "while true; do; curl -f https://connect.stage.danim.com &>/dev/null || echo 502; echo 'Sleep...'; sleep .5; done" will output that on app update:
    #   Sleep...
    #   Sleep...
    #   502
    #   Sleep...
    #   Sleep...
    #   502
    #
    # With it, that will be:
    #   Sleep...
    #   Sleep...
    #   Sleep...
    #   Sleep...
    #   Sleep...
    #   Sleep...
    #
    # That's because docker will wait a little bit for containers to be healthy before continuing the rolling.
    # In other words, the rolling is done in a smarter way if the heathcheck is configured
    healthcheck:
      test: [ 'CMD', '/healthcheck.sh' ]
      interval: ${API_DOCKER_HEALTHCHECK_INTERVAL}s
      timeout: 10s
      retries: ${API_DOCKER_HEALTHCHECK_RETRIES}
      start_period: ${API_DOCKER_HEALTHCHECK_START_PERIOD}s
