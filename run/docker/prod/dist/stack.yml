      - "${ROOT_DIR}/var/api/cache:/var/www/b8x/var/api/cache"
      - "${ROOT_DIR}/var/sock:/var/www/b8x/var/sock"
    stdin_open: true
    tty: true
    working_dir: "/var/www/b8x"
    sysctls: 
      net.ipv4.tcp_keepalive_time: 9600
      net.ipv4.tcp_keepalive_intvl: 60
      net.ipv4.tcp_keepalive_probes: 5
