version: "3.7"
networks: 
  stack-default: 
    driver: "overlay"
    attachable: true
services: 
  api: 
    image: "${DOCKER_IMAGE_PREFIX}/${DOCKER_IMAGE_API_WRAP}"
    volumes: 
      - "${ROOT_DIR}/bin:/var/www/b8x/bin"
      - "${ROOT_DIR}/scratch:/var/www/b8x/scratch"
      - "${ROOT_DIR}/src:/var/www/b8x/src"
      - "${ROOT_DIR}/test:/var/www/b8x/test"
