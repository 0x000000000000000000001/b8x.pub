services:
  db:
    volumes:
      - ${DOCKER_DIR}/${ENV}/volume/db/data:/var/lib/postgresql/data
    ports:
      - published: 5432 # not possible (yet) to limit access to host only: https://github.com/docker/docker.github.io/issues/9155
        target: 5432
        mode: host # ssh access compatible with "mode: host" routing
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/var/lib/postgresql/server.crt"
      - "-c"
      - "ssl_key_file=/var/lib/postgresql/server.key"
      - "-c"
      - "max_connections=400"
      - "-c"
      - "checkpoint_timeout=30min"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "commit_delay=5000"
      - "-c"
      - "commit_siblings=5"
      - "-c"
      - "idle_in_transaction_session_timeout=10000"
