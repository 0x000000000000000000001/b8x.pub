# Static configuration

log:
  level: DEBUG

api:
  insecure: true
  dashboard: true

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    network: core_compose-default
    constraints: "Label(`x.traefik.gateway`, `gateway`)"
    exposedByDefault: false
  file:
    directory: /etc/traefik/mnt/dynamic

entryPoints:
  web:
    address: ':80'
  sweb:
    address: ':443'
