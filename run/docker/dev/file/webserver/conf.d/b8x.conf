# Helper: https://nginx.viraptor.info/

include /etc/nginx/conf.d/ssl.conf;

# An 'upstream' block defines a destination group of servers for proxying.
# Here, 'nginx_loopback' points to Nginx's own internal unix socket.
# 'keepalive 64' enables a connection pool of 64 idle connections to avoid
# socket connection overhead (TCP/Unix handshake) on every internal proxy request.
upstream nginx_loopback {
    server unix:/tmp/nginx_loopback.sock;
    keepalive 64;
}

# api
server {
    listen $NGINX_DEFAULT_HTTP_PORT;
    listen [::]:$NGINX_DEFAULT_HTTP_PORT;
    listen unix:/tmp/nginx_loopback.sock;

    server_name $API_DNS_LEVEL_3_GTE;

    # Increase header buffer size to support large cached POST bodies sent as X-Request-Body
    client_header_buffer_size 64k;
    large_client_header_buffers 4 256k;

    location ^~ /write/ {
        if ($is_bot) {
            return 403;
        }

        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = 'OPTIONS') {
            # Nginx weirdness: add_header in a nested block wipes out parent headers, so we MUST duplicate them here.
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            add_header 'Access-Control-Expose-Headers' 'ETag' always;
            
            # Cache the preflight authorization for 20 days (1728000s) to avoid OPTIONS latency on every API call
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    location ~ ^/sitemap.*\.(xml|xsl)$ {
        rewrite ^/sitemap\.xml$ /sitemap/index.xml break;

        proxy_cache sitemap_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header X-Cache-Status $upstream_cache_status;

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    # Stage 1: Public endpoint for API reads.
    # Reads the full request body from the client before passing to Stage 2 loopback.
    # Whitelists custom headers like X-App-Id and X-Bypass-Cache in CORS.
    location ^~ /read/ {
        if ($is_bot) {
            return 403;
        }

        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With,X-App-Id,X-Bypass-Cache' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With,X-App-Id,X-Bypass-Cache' always;
            add_header 'Access-Control-Expose-Headers' 'ETag' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Stage 1: Read the full request body and proxy to Stage 2
        resolver 127.0.0.11 valid=0s ipv6=off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Body $request_body;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://nginx_loopback/loopback/read/;
    }

    location ^~ /loopback/read/ {
        allow 127.0.0.1;
        allow unix:;
        deny all;

        proxy_cache api_read_cache;
        proxy_cache_methods POST;
        
        # Stage 2: Cache lookup using header-forwarded request body.
        proxy_cache_key "$scheme$host$request_uri|$http_x_app_id|$http_authorization|$http_x_request_body";
        proxy_cache_valid 200 1s;

        # Ignore backend caching headers to enforce Nginx's 1s TTL.
        proxy_ignore_headers Cache-Control Expires;

        # Strip Date header to prevent container clock-drift from instantly expiring cache entries.
        proxy_hide_header Date;

        # proxy_cache_bypass forces fresh data fetch and updates the cache if X-Bypass-Cache header is sent.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # proxy_cache_background_update must be off for POST requests, as background
        # subrequests in Nginx can discard the POST request body, breaking cache updates.
        proxy_cache_background_update off;

        # Lock/queue concurrent requests to prevent cache stampedes under high concurrency.
        proxy_cache_lock on;
        proxy_cache_bypass $http_x_bypass_cache;
        proxy_ignore_client_abort on;

        add_header X-Cache-Status $upstream_cache_status;

        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        rewrite ^/loopback/read/(.*)$ /read/$1 break;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = 'OPTIONS') {
            # Nginx weirdness: add_header in a nested block wipes out parent headers, so we MUST duplicate them here.
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            add_header 'Access-Control-Expose-Headers' 'ETag' always;
            
            # Cache the preflight authorization for 20 days (1728000s) to avoid OPTIONS latency on every API call
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# mq
server {
    listen $NGINX_DEFAULT_HTTP_PORT;
    listen [::]:$NGINX_DEFAULT_HTTP_PORT;

    server_name $MQ_DNS_LEVEL_3_GTE;

    location / {
        # No auth, because it conflicts with the manager one.

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream mq:15672;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# news
server {
    listen $NGINX_DEFAULT_HTTP_PORT;
    listen [::]:$NGINX_DEFAULT_HTTP_PORT;

    server_name $NEWS_DNS_LEVEL_3_GTE;

    # Disable buffering for Sendy to stream large exports/imports if needed
    proxy_buffering off;

    location / {
        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream news:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# ui
server {
    listen $NGINX_DEFAULT_HTTP_PORT;
    listen [::]:$NGINX_DEFAULT_HTTP_PORT;
    listen unix:/tmp/nginx_loopback.sock;

    server_name $DNS_LEVEL_2_GTE;

    # Increase header buffer size to support large cached POST bodies sent as X-Request-Body
    client_header_buffer_size 64k;
    large_client_header_buffers 4 256k;

    include /etc/nginx/conf.d/redir/rewrite/*.conf;

    location ~ ^/sitemap.*\.(xml|xsl)$ {
        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;

        rewrite ^/sitemap\.xml$ /sitemap/index.xml break;
        rewrite ^/sitemap_index\.xml$ /sitemap/index.xml break;

        proxy_cache sitemap_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header X-Cache-Status $upstream_cache_status;

        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    if ($new_article_slug != 0) {
        return 301 $new_article_slug; 
    }

    if ($new_magazine_slug != 0) {
        return 301 $new_magazine_slug;
    }

    location ^~ /social/meta {
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    location ^~ /social/watermark/ {
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    # Stage 1 (UI Router): Routing API reads from frontend domain.
    # Reads full request body first, whitelists CORS headers including X-Bypass-Cache.
    location ^~ /api/read/ {
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With,X-App-Id,X-Bypass-Cache' always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,If-None-Match,Keep-Alive,Origin,User-Agent,X-Requested-With,X-App-Id,X-Bypass-Cache' always;
            add_header 'Access-Control-Expose-Headers' 'ETag' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Stage 1: Read the full request body and proxy to Stage 2
        resolver 127.0.0.11 valid=0s ipv6=off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Body $request_body;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://nginx_loopback/loopback/api/read/;
    }

    location ^~ /loopback/api/read/ {
        allow 127.0.0.1;
        allow unix:;
        deny all;

        proxy_cache api_read_cache;
        proxy_cache_methods POST;
        # Stage 2 (UI Router): Cache lookup using header-forwarded request body.
        proxy_cache_key "$scheme$host$request_uri|$http_x_app_id|$http_authorization|$http_x_request_body";
        proxy_cache_valid 200 1s;

        # Ignore backend caching headers to enforce Nginx's 1s TTL.
        # The Purescript backend can, in fact, control the value of `proxy_cache_valid` itself (e.g., `s-maxage`)
        proxy_ignore_headers Cache-Control Expires;

        # Strip Date header to prevent container clock-drift from instantly expiring cache entries.
        proxy_hide_header Date;

        # proxy_cache_bypass forces fresh data fetch and updates the cache if X-Bypass-Cache header is sent.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # proxy_cache_background_update must be off for POST requests, as background
        # subrequests in Nginx can discard the POST request body, breaking cache updates.
        proxy_cache_background_update off;

        # Lock/queue concurrent requests to prevent cache stampedes under high concurrency.
        proxy_cache_lock on;
        proxy_cache_bypass $http_x_bypass_cache;
        proxy_ignore_client_abort on;

        add_header X-Cache-Status $upstream_cache_status;

        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        rewrite ^/loopback/api/(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    location ^~ /api/ {
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream api:80;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;
    }

    location ~ ^/([^/\.]+)$ {
        if ($is_social_bot) {
            rewrite ^/(.*)$ /social/meta?path=/$1 last;
        }

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream ui:8080;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;

        # Web socket support (hot reloading)
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    location / {
        # No auth, because it conflicts with the manager one.
        
        if ($is_social_bot) {
            rewrite ^/(.*)$ /social/meta?path=/$1 last;
        }

        # Dynamic, see https://ilhicas.com/2018/04/14/Nginx-Upstream-Unavalailble-Docker.html
        resolver 127.0.0.11 valid=0s ipv6=off;
        set $upstream ui:8080;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_pass http://$upstream;

        # Web socket support (hot reloading)
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# ... http -> https redirections
server {
    listen 80;
    listen [::]:80;

    server_name $API_DNS_LEVEL_3_GTE $DNS_LEVEL_2_GTE $MQ_DNS_LEVEL_3_GTE $NEWS_DNS_LEVEL_3_GTE v2.$DNS_LEVEL_2_GTE books.fr www.books.fr;

    return 301 https://$host$request_uri;
}

server {
    listen $NGINX_DEFAULT_HTTP_PORT;
    listen [::]:$NGINX_DEFAULT_HTTP_PORT;
    listen unix:/tmp/nginx_loopback.sock;

    server_name v2.$DNS_LEVEL_2_GTE books.fr www.books.fr;

    return 301 https://$DNS_LEVEL_2_GTE$request_uri;
}
