services:
  webserver:
    image: "${DOCKER_IMAGE_PREFIX}/${DOCKER_IMAGE_DEV_WEBSERVER}"
    volumes:
      # Debug:
      - ${DOCKER_DIR}/_shared/file/webserver/nginx.conf:/etc/nginx/nginx.conf
      - ${DOCKER_DIR}/_shared/file/webserver/conf.d/redir:/etc/nginx/conf.d/redir
      - ${DOCKER_DIR}/${ENV}/file/webserver/conf.d/b8x.conf:/etc/nginx/templates/b8x.conf.template
    ports:
      - 9000:9000
    security_opt:
      - apparmor:unconfined # remove some linux firewalls if set
    extra_hosts:
      # 172.17.0.1 is the bridge gateway
      - '${API_DNS_LEVEL_3_GTE}:172.17.0.1'
      - 'host.docker.internal:${DOCKER_HOST_IP:-host-gateway}'
