    unfoldable:
      path: "../phpurs/phpurs-unfoldable"
    strings:
      path: "../phpurs/phpurs-strings"
    arrays:
      path: "../phpurs/phpurs-arrays"
    argonaut-core:
      path: "../phpurs/phpurs-argonaut-core"
    datetime:
      path: "../phpurs/phpurs-datetime"
